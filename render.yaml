services:
  - type: web
    name: bizlens-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://meraj-munshi.github.io
      - key: DATABASE_URL
        sync: false
