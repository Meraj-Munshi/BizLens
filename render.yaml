services:
  - type: web
    name: bizlens-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run db && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://meraj-munshi.github.io
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '3306'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'false'
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: 'true'
